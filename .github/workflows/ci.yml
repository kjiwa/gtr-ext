name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check test vectors match the proxy
        run: curl -fsSL https://raw.githubusercontent.com/kjiwa/gtr-proxy/master/test/vectors.json | cmp - test/vectors.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:ext
      - run: npm run pkg
      - uses: actions/upload-artifact@v7
        with:
          name: gtr-ext
          path: gtr-ext-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: gh extension install kjiwa/gh-cut --pin v0.1.0
      - run: gh cut check "$TAG" "$TAG"
      - run: gh cut notes "${TAG#v}" > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v8
        with:
          name: gtr-ext
      - uses: softprops/action-gh-release@v3
        with:
          files: gtr-ext-*.zip
          body_path: ${{ runner.temp }}/notes.md
